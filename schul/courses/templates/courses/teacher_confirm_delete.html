
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Видалити курс — LMS</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f6fb; padding: 30px; color: #263248; }
        main { max-width: 550px; margin: 60px auto; background: white; padding: 30px; border-radius: 14px; }
        button, a { display: inline-block; padding: 12px 16px; border-radius: 8px; border: 0; text-decoration: none; cursor: pointer; }
        button { background: #b93838; color: white; }
        a { background: #e9effb; color: #294878; }
    </style>
</head>
<body>
<main>
    <h1>Видалити курс?</h1>
    <p>Ти збираєшся видалити курс «{{ course.title }}».</p>
    <p>Цю дію не можна скасувати.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Так, видалити</button>
        <a href="{% url 'teacher_dashboard' %}">Скасувати</a>
    </form>
</main>
</body>
</html>

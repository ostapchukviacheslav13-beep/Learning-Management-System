
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід — LMS</title>
</head>
<body>
    <h1>Вхід до LMS</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>

    <p>Немає акаунта? <a href="{% url 'register' %}">Зареєструватися</a></p>
    <a href="{% url 'course_list' %}">На головну</a>
</body>
</html>

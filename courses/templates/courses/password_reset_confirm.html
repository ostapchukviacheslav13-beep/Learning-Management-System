
{% extends "courses/base.html" %}
{% block title %}Новий пароль{% endblock %}
{% block content %}
<div class="card" style="max-width:550px;margin:auto">
    {% if validlink %}
        <h1>Створи новий пароль</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn green" type="submit">Змінити пароль</button>
        </form>
    {% else %}
        <h1>Посилання недійсне</h1>
        <p>Запроси нове посилання для відновлення пароля.</p>
        <a class="btn" href="{% url 'password_reset' %}">Спробувати знову</a>
    {% endif %}
</div>
{% endblock %}

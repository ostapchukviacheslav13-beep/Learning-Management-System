
{% extends "courses/base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="card" style="max-width:750px;margin:auto">
    <h1>{{ page_title }}</h1>
    <p>Курс: {{ course.title }}</p>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="errorlist">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <button class="btn green" type="submit">Зберегти урок</button>
        <a class="btn gray" href="{% url 'course_detail' course.id %}">Скасувати</a>
    </form>
</div>
{% endblock %}

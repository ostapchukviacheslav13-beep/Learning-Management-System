
{% extends "courses/base.html" %}
{% block title %}Відновлення пароля{% endblock %}
{% block content %}
<div class="card" style="max-width:550px;margin:auto">
    <h1>Забув пароль?</h1>
    <p>Введи електронну пошту, вказану під час реєстрації.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn green" type="submit">Надіслати посилання</button>
    </form>
</div>
{% endblock %}
